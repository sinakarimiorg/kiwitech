name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest   # لینوکس حساس به حروف بزرگ/کوچک مسیرهاست، پس باگ‌های import همین‌جا گرفته می‌شود
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # build به دیتابیس وصل نمی‌شود؛ فقط برای آدرس‌های مطلق SEO
          NEXT_PUBLIC_SITE_URL: https://example.com
